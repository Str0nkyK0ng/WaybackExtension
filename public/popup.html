<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Wayback Extension</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="app">
      <div class="header">
        <h1>
          <img
            src="/icons/icon_32.png"
            alt="Wayback Extension Icon"
            class="popup-icon"
          />
          Wayback Extension
          <img
            src="/icons/icon_32.png"
            alt="Wayback Extension Icon"
            class="popup-icon"
          />
        </h1>
      </div>

      <div class="status-div" id="status-div">
        <p class="status" id="status"></p>
        <svg
          id="spinning-icon"
          stroke="currentColor"
          class="spinning-icon"
          fill="none"
          strokeWidth="5"
          viewBox="0 0 24 24"
          strokeLinecap="round"
          strokeLinejoin="round"
          height="3em"
          width="3em"
          style="display: none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <line x1="12" y1="2" x2="12" y2="6"></line>
          <line x1="12" y1="18" x2="12" y2="22"></line>
          <line x1="4.93" y1="4.93" x2="7.76" y2="7.76"></line>
          <line x1="16.24" y1="16.24" x2="19.07" y2="19.07"></line>
          <line x1="2" y1="12" x2="6" y2="12"></line>
          <line x1="18" y1="12" x2="22" y2="12"></line>
          <line x1="4.93" y1="19.07" x2="7.76" y2="16.24"></line>
          <line x1="16.24" y1="7.76" x2="19.07" y2="4.93"></line>
        </svg>
      </div>

      <!-- Mode toggle -->
      <div class="mode-toggle" role="radiogroup" aria-label="Apply Mode">
        <input type="radio" id="mode-diff" name="mode" value="DIFF" checked />
        <label for="mode-diff" class="mode-option">SEE DIFFERENCES</label>

        <input type="radio" id="mode-replace" name="mode" value="REPLACE" />
        <label for="mode-replace" class="mode-option"
          >JUST <br />
          REPLACE</label
        >
      </div>

      <div class="button-container">
        <div>
          <label for="start">Earliest Date:</label>
          <input
            type="date"
            id="start"
            name="search-start"
            min="1996-10-01"
            max=""
          />
        </div>
        <div>
          <label for="end">Latest Date:</label>
          <input
            type="date"
            id="end"
            name="search-end"
            min="2018-01-01"
            value=""
            max=""
          />
        </div>
        <button id="search" class="button">Search</button>
      </div>

      <div class="footer">
        <button id="source" class="options">Source Code</button>
        ○
        <button id="options" class="options">Options</button>
      </div>

      <script src="applyConfig.js"></script>
      <script src="popup.js"></script>
    </div>
  </body>
</html>
